limitations:
  - "The kext is stripped; function names come from signature-based symbolication and are candidate labels."
  - "Shape-normalized matches ignore immediate values and can match unrelated boilerplate; a unique match is stronger evidence than a shared hash but is not source-level proof of identity."
  - "Slot indices are parser output; inherited slots and vtable alignment can affect the reported slot number."
  - "The unresolved functions are unnamed and their body hashes are ambiguous or absent; no name is assigned to them."
  - "The raw binaries are not committed; the artifact records hashes and reproduction commands."
  - "No CVE is mapped; no vulnerability, exploitability, or protection-bypass conclusion is drawn."
  - "No device was connected; runtime dispatch and behavior were not measured."
