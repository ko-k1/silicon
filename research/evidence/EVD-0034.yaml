claim: "Function-start alignment resolves part of the 55-row AppleH11ANEInterface vtable comparison. The rows contain 32 unique old functions and 34 unique new functions. Seven old/new pairs are the same function at a different vtable slot, confirmed by a unique exact-normalized or shape-normalized body match: 0xfffffff00898ac0c -> 0xfffffff0089c9114, 0xfffffff0089f8aa0 -> 0xfffffff008a23788, 0xfffffff0089c8670 -> 0xfffffff0089f23a8, 0xfffffff0089c8798 -> 0xfffffff0089f24d0, 0xfffffff0089c8910 -> 0xfffffff0089f2648, 0xfffffff0089c8a58 -> 0xfffffff0089f2790, and 0xfffffff0089c673c -> 0xfffffff0089f0474. The last two carry the names ANEHWDevice::ReleaseDebugWorkProcessor and ANEHWDevice::ANE_RegisterDebugWorkProcessor and move from slots 225/226 to 229/230 in ANEHWDevice and H11ANEIn; those four raw one-sided rows are therefore slot reordering, not method replacement. Seven other pairs are same-name/same-slot body changes: ANEClientHintsUserClient::setProperties, ANEDriver::start, ANEHWDevice::start, ANEHWDevice::stop, ANEHWDevice::dartUnmapMemoryDescriptor, ANEScheduler::free, and ANEScheduler::init. The remaining 18 old and 20 new functions are unresolved: they are unnamed and their body hashes are ambiguous or absent. ANEHWDevice and H11ANEIn grow from 232 to 236 vtable slots and ANEDeviceInterface from 222 to 226, which shifts later slots and creates spurious same-index comparisons. The earlier PMSettingObject::pmSettingObject label at 0xfffffff00a8e69e8 is reproducible with the xnu-only signature set; the full xnu+kext map at the same commit names that address IOUserClient::sendAsyncResult. No CVE is mapped and no vulnerability conclusion is drawn."
