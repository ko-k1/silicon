claim: "The A14/T8101 and A15/T8150 24A446 SPTM payloads share source version 820.0.22 and the same build timestamp but have different UUIDs and sizes; their TXM payloads are byte-identical. The A14 24B119 SPTM is source version 820.40.24 and contains the uat_dekker, uat_sync_outer_tlb_sapt_flush, verify-gmmu-tlbis-at-sync, gmmu-tlbi-verification, and VIOLATION_NVME_ILLEGAL_HIBERNATION_QUEUE_LATCH string family absent from the A14 24A446 SPTM. The public T8150 research's 27.0.1 SPTM version row (820.40.18) is not reproduced by direct extraction; the 24A446 T8150 payload is 820.0.22."
