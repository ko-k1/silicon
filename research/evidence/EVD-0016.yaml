    - "iPhone13,2"
    - "iPhone13,3"
    - "A14 (T8101)"
    - "iOS 27.0.1"
    - "24A446"
artifact:
  sha256: "51827a7ebd3b9130d03acf200e269ba66768fa42e1569b246b053a1c22c29364"
  bytes: 1053229
