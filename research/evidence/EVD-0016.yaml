limitations:
  - "Build packaging establishes that SPTM, TXM, and kernelcache payloads are referenced for these product types and build; it is not a runtime measurement."
  - "The cross-product digest comparison uses the iPhone13,1 manifest (EVD-0010) and iPhone13,4 manifest (EVD-0014), each pinned by its own SHA-256."
  - "The combined manifest covers iPhone13,2 and iPhone13,3 together; it does not establish per-device installation or boot behavior."
  - "Research identities are present in the manifest; they are recorded separately and are not treated as the production configuration."
  - "Digest equality identifies the payloads referenced by the manifests; it is not a byte-for-byte comparison of the remote payload files. EVD-0017 and VAL-0006 add the later byte-level kernelcache comparison."
  - "The extracted BuildManifest.plist is not committed; only its hash and selected metadata are retained."
