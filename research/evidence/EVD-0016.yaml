schema_version: 1
id: EVD-0016
class: primary
state: observed
claim: "The combined iOS 27.0.1 (24A446) BuildManifest for iPhone13,2 and iPhone13,3 contains SPTM and TXM payloads, marks customer identities' InstalledSPTM/RestoreSPTM as Production, and references the same SPTM, release TXM, and release kernelcache payload digests as the iPhone13,1 and iPhone13,4 manifests."
source:
  type: apple-build-manifest
  locator: "https://updates.cdn-apple.com/2026FallFCS/8cd410bb-bddb-4483-8638-ac75d2c5e944/iPhone13,2,iPhone13,3_27.0.1_24A446_Restore.ipsw"
