claim: "The 24B119 `ipsw kernel kexts` inventory lists 267 kext records common to 24A446, with 47 version changes and no additions or removals; the MH_FILESET entry count is 250, so these inventories are not interchangeable. com.apple.driver.AppleAVE2 changes from 913.43.1 to 913.64.1; its extracted image has 2,995 and 2,998 function starts, 1,222 exact-normalized matches, and 2,963 shape-normalized matches. com.apple.driver.AppleH11ANEInterface changes from 10.19.6 to 10.102.4; its extracted image has 4,902 and 5,043 function starts, 3,080 exact-normalized matches, and 4,662 shape-normalized matches. These are build-level changes, not a CVE attribution or a proof that a changed function fixes a named vulnerability."
