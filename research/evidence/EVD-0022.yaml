claim: "Comparing the iPhone13,1 BuildManifest component entries between iOS 27.0.1 (24A446) and iOS 27.2 (24B119) shows 57 of 95 entries differ and 38 are identical, with no component keys added or removed. Of the 57 differences, 56 are payload-digest changes and one is a path-only change (BasebandFirmware, from Mav20-8.00.01.Release.bbfw to Mav20-8.10.01.Release.bbfw). Changed entries include KernelCache, Ap,SecurePageTableMonitor, Ap,TrustedExecutionMonitor, Ap,RestoreSecurePageTableMonitor, Ap,RestoreTrustedExecutionMonitor, SEP, iBoot, LLB, iBEC, iBSS, DeviceTree, the OS and Cryptex volume entries, and their trust-cache entries."
source:
