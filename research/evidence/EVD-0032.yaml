claim: "In the 24B119 com.apple.kernel, thread_set_state_internal (0xfffffff00a244dc8, 348 instructions) queries com.apple.security.cs.debugger after com.apple.private.thread-set-state in three access-check paths. The 24A446 function (0xfffffff00a208a10, 324 instructions) queries only com.apple.private.thread-set-state. The new function also calls an unidentified policy routine at 0xfffffff00aa1aedc when bit 0 of its flag argument is set, returning 8 if that call fails. The com.apple.security.cs.debugger string is absent from the 24A446 kernel and present once in 24B119. This is an observed behavior change; the net authorization effect of the combined branch (broadening or narrowing) is not established from the decompilation alone. It does not establish a vulnerability fix, a security improvement, or exploitability."
