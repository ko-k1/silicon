claim: "The AppleH11ANEInterface vtable comparison reports 55 raw structural slots across 34 unique target pairs, but that count is not a method-change count. With names assigned only when a target equals a symbolicated function start, the 55 rows give 11 same-name/same-slot rows with changed bodies (7 unique target pairs), 8 one-sided-name rows (4 unique target pairs), and 36 both-unnamed rows (23 unique target pairs). The four old-only rows and four new-only rows are the same two methods moving from slots 225/226 to 229/230; function-start alignment confirms them as slot reordering. Two same-name methods appear at different slots (four rows across two classes), not 12. The 16 inherited slot-71 rows are IOUserClient::sendAsyncResult on both sides, not a name change. The earlier PMSettingObject::pmSettingObject label is reproducible with an xnu-only signature map; the full xnu+kext signature map at the same commit names 0xfffffff00a8e69e8 IOUserClient::sendAsyncResult. This is a signature-set coverage artifact. ANE also gains three classes: ANEPoolRefillMsg, OSValueObject<ANEInferenceRequest*>, and OSValueObject<ANEMapRequest*>. The named changed-body candidates are labels only: ANEClientHintsUserClient::setProperties, ANEDriver::start, ANEHWDevice::start, ANEHWDevice::stop, ANEHWDevice::dartUnmapMemoryDescriptor, ANEScheduler::free, and ANEScheduler::init."
