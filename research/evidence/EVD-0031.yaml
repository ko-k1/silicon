claim: "The AppleH11ANEInterface vtable comparison reports 55 raw structural slots across 34 unique target pairs, but that count is not a method-change count. Name-aware classification of the 55 rows gives 11 same-name/same-slot rows with changed bodies (7 unique target pairs), 20 one-sided-name rows (11 unique target pairs, including slot reordering), and 24 both-unnamed rows (16 unique target pairs). Separately, 12 same-name rows appear at different slots, and 16 same-slot rows at inherited slot 71 map to a new symbolicator label (PMSettingObject::pmSettingObject) whose disassembly matches 27.0 IOUserClient::sendAsyncResult. The 27.2 symbol map does not contain sendAsyncResult, so at least one symbolicator label is demonstrably wrong. ANE also gains three classes: ANEPoolRefillMsg, OSValueObject<ANEInferenceRequest*>, and OSValueObject<ANEMapRequest*>. The named changed-body candidates are labels only: ANEClientHintsUserClient::setProperties, ANEDriver::start, ANEHWDevice::start, ANEHWDevice::stop, ANEHWDevice::dartUnmapMemoryDescriptor, ANEScheduler::free, and ANEScheduler::init."
