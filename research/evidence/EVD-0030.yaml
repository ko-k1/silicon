claim: "The 24B119 AppleAVE2 binary adds three named validation routines that are absent from the 24A446 symbol map and whose 27.2 __os_log anchor strings are absent from the 24A446 binary: AVE_HEVC_CheckVPSExtBounds at 0xfffffff008421158 (310 instructions), AVE_Client_CheckMCTFInfo at 0xfffffff008423b1c (737 instructions), and AVE_Client_CheckLRMEInfo at 0xfffffff0084246a0 (571 instructions). They contain unsigned range checks with limits including 0x40/0x41, 0x2/0x8/0x6/0xf/0x10/0x1/0x3f/0x41/0x11/0xd/0x3/0x15, and 0x2/0x7/0x8/0x6/0xf/0x10/0x1/0x3f/0x41/0x11/0xd/0x15. AVE_HEVC_CheckVPSExtBounds is called from AVE_HEVC_CheckInfo, AVE_Client_CheckDMVInfo, AVE_Client_CheckGGMInfo, AVE_Client_CheckMCTFInfo, and AVE_Client_CheckLRMEInfo; the other two are called from AVE_Client_CheckInfo. The 27.2 advisory lists six AVEVideoEncoder CVEs described as one out-of-bounds read and five out-of-bounds writes addressed with improved input validation or bounds checking. This is a temporal and functional correlation, not a CVE attribution."
