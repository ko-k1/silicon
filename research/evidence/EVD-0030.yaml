  - "Same virtual addresses across builds are not function correspondence; the old same-VA functions have different prologues and line-number immediates."
  - "Range-check constants establish validation structure only; they do not identify a specific input bug or CVE."
  - "The 27.2 advisory describes six AVEVideoEncoder CVEs, but no routine is mapped to a CVE."
