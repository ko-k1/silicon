claim: "The 24B119 AppleAVE2 binary adds three named validation routines that are absent from the 24A446 symbol map and whose 27.2 __os_log anchor strings are absent from the 24A446 binary: AVE_HEVC_CheckVPSExtBounds at 0xfffffff008421158 (310 instructions), AVE_Client_CheckMCTFInfo at 0xfffffff008423b1c (737 instructions), and AVE_Client_CheckLRMEInfo at 0xfffffff0084246a0 (571 instructions). They contain unsigned range checks with limits including 0x40/0x41 (VPS), 0x2/0x8/0x6/0xf/0x10/0x1/0x3f/0x41/0x11/0xd/0x3/0x15 (MCTF), and 0x2/0x7/0x8/0x6/0xf/0x10/0x1/0x3f/0x41/0x11/0xd/0x21 (LRME). Caller wiring changed: AVE_HEVC_CheckInfo grew from 361 to 893 instructions and now calls AVE_HEVC_CheckVPSExtBounds; AVE_Client_CheckInfo grew from 506 to 604 instructions and now calls AVE_Client_CheckGGMInfo, AVE_Client_CheckLRMEInfo, and AVE_Client_CheckMCTFInfo. New 27.2 log strings include HEVC VPS/PPS/RPS/SPS count out-of-range, VPS extension layer/OLS counts, VPS num_add_layer_sets, log2_max_pic_order_cnt_lsb_minus4, number of sub-layer/temporal-layer bounds, and MCTF strength count; new constraint strings cover sHEVC_VPS vps_max_sub_layers_minus1/vps_num_layer_sets_minus1/vps_num_hrd_parameters/vps_max_layer_id, sHEVC_VPS num_add_layer_sets, sHEVC_RPS num_short_term_ref_pic_sets, MCTF/AV1 strength-level ranges, sHEVC_PPS tile columns/rows, sHEVC_SPS log2_max_pic_order_cnt_lsb_minus4/sps_max_sub_layers_minus1, sHEVC iNumberOfTemporalLayers, and sGOP iNumOfTemporalLayer; three temporal-layer strings were removed (relaxed bounds). The 27.2 advisory lists six AVEVideoEncoder CVEs described as one out-of-bounds read and five out-of-bounds writes addressed with improved input validation or bounds checking. This is a temporal and functional correlation, not a CVE attribution."
