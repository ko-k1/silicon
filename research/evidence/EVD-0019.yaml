claim: "The iOS 27.0.1 (24A446) restore image for iPhone13,1 contains Firmware/txm.iphoneos.release.im4p, a valid Image4 `trxm` payload of 223,884 bytes whose SHA-384 value equals the BuildManifest `Ap,TrustedExecutionMonitor` Digest. It decompresses with LZFSE to a 557,088-byte arm64e Mach-O with UUID 9F80F5EC-09C8-3E9F-A196-13A6250C04E0, LC_SOURCE_VERSION 217.0.2, embedded `txm.iphoneos.release` / `txm.iphoneos.release.TrustedExecutionMonitor_Guarded-217.0.2` identifiers, a `__TEXT_BOOT_EXEC` segment with a `__bootcode` section, and no top-level __PPL-named segment."
