claim: "In the 24B119 com.apple.kernel, vm_map_remap (0xfffffff00a2b7fd4, 449 instructions) adds an early rejection for remap requests where flag bit 8 is set and either flag bit 43 is set or the value at *param_9 or *param_10 exceeds 1. It also clears bits 7 and 16 of VM-entry flags (mask 0xfffeff7f) when flag bit 8 is set and entry bit 7 is set; the 24A446 function has neither block. vm_object_update (0xfffffff00a29be58, 1157 instructions) adds vm_object_pl_req_begin and vm_object_pl_req_end accounting with overflow and underflow panics on a 32-bit counter at object byte offset 0xe8; the strings and counter logic are absent from the 24A446 function (0xfffffff00a25fa44, 1029 instructions). These are observed code changes. No CVE is mapped and no fix, exploitability, or protection-bypass conclusion is drawn."
