claim: "In the 24B119 com.apple.kernel, both ipc_is_valid_exception_port and set_exception_ports_validation query com.apple.security.cs.debugger in addition to the existing com.apple.private.set-exception-port entitlement. The string com.apple.security.cs.debugger is absent from the 24A446 kernel and present once in 24B119. The 30-instruction entitlement helper used by ipc_is_valid_exception_port is shape-identical between builds (old 0xfffffff00a97d030, new 0xfffffff00a9bd5cc). This is an observed behavior change; it does not establish a vulnerability fix, a security improvement, or exploitability."
