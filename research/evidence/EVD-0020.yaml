limitations:
  - "The retagged IM4P files were generated for the comparison and are not committed; the recorded hashes identify the checked bytes."
  - "The check covers the IM4P type field only. It does not construct the outer IMG4 with an AP ticket or IM4R, verify signatures, or test device acceptance."
  - "Only the iPhone13,1 image was checked directly; the matching restore digests in the other A14 manifests are manifest-level observations, not separate retag reproductions."
  - "Digest equality at the IM4P level is build-artifact evidence, not a runtime measurement or a boot-path claim."
