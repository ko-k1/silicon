claim: "The 24A446 iPhone13,1 BuildManifest restore entries for SPTM and TXM are fourcc-retagged copies of the installed IM4P payloads. Replacing only the IM4P type field `sptm` -> `rspt` gives SHA-384 64ba16b4ca3bbf698d7a04957eb45d09e80e7f3fca8e7ee1d93a0670d9135e3a38841ec7e49666c15fd5faec05312955, equal to the `Ap,RestoreSecurePageTableMonitor` Digest; replacing only `trxm` -> `rtrx` gives SHA-384 573a242a31c5f094d0c9f133d2c028efc5c6242816875fdf44d2450d32acee8ca4548898eda3988d9a8aa46f2b33b06d, equal to the `Ap,RestoreTrustedExecutionMonitor` Digest. The file lengths and all other bytes remain unchanged. Public restore implementations document this re-tagging and outer IMG4 stitching pattern (`SRC-0018`, `SRC-0019`)."
source:
  type: derived-image4-retag-comparison
  locator: "Derived from Apple's public iPhone13,1 iOS 27.0.1 (24A446) restore image: https://updates.cdn-apple.com/2026FallFCS/d1cd8e9c-7afc-42aa-99d4-dda92b9fe9db/iPhone13,1_27.0.1_24A446_Restore.ipsw"
