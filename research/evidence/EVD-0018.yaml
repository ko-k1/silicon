claim: "The iOS 27.0.1 (24A446) restore image for iPhone13,1 contains Firmware/sptm.t8101.release.im4p, a valid Image4 `sptm` payload of 187,580 bytes whose SHA-384 value equals the BuildManifest `Ap,SecurePageTableMonitor` Digest. It decompresses with LZFSE to a 1,179,680-byte arm64e Mach-O with UUID 1693386C-1F3A-346B-906D-804E7138B2F1, LC_SOURCE_VERSION 820.0.22, embedded `sptm.t8101.release` / `SPTM-820.0.22` identifiers, and no top-level __PPL-named segment."
