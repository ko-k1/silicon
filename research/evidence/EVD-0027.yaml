claim: "A first normalized function-level comparison of com.apple.kernel between iOS 27.0.1 (24A446) and iOS 27.2 (24B119) reports 20,873 function starts in 24A446 and 20,897 in 24B119; 20,872 and 20,896 functions respectively contained disassembled instructions. Of 20,872 old and 20,896 new functions, 13,045 have an exact normalized match and 20,399 have a shape-normalized match. Symbolicator named 5,318 functions at the same start address in both images: 2,246 are exact-normalized identical, 2,850 differ only in immediates, and 222 are structurally different; 52 old names and 51 new names are unmatched. The 222 structural names include IPC, VM, process, filesystem, networking, exception, and port paths, but no function is attributed to a CVE. This record also corrects the earlier 1,361/1,382 function-start count in EVD-0023, which was not reproduced."
