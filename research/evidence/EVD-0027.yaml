limitations:
  - "Function starts come from ipsw and can include labels that are not semantic function boundaries; instruction-count changes are not proof of a semantic change."
  - "Address normalization cannot distinguish every real immediate change from a layout-dependent address materialization."
  - "Named comparison covers only functions named by symbolicator at the exact start address; unmatched names may be renamed, removed, or newly added functions."
  - "The kernel is stripped; no source-level semantics, call-graph equivalence, or CVE attribution is established."
  - "The earlier 1,361/1,382 count in EVD-0023 was an undercount and is superseded by this record; the corrected count is independently reproduced by ipsw and by decoding LC_FUNCTION_STARTS relative to __TEXT."
  - "No device was connected; runtime behavior and exploitability were not measured."
