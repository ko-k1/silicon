claims:
  - "Firmware/sptm.t8101.release.im4p is a 187,580-byte Image4 payload with FourCC `sptm`, LZFSE compression, and no encryption flag; its SHA-384 value is 3d99f0041b42c5c5e70f97281533914231d0d1d2709a98f28117149c27523d0c388645e808dabd4597a532d4c090844f."
  - "The BuildManifest `Ap,SecurePageTableMonitor` Digest field for the iPhone13,1 customer identity equals that SHA-384 value."
  - "The SPTM payload decompresses to a 1,179,680-byte arm64e Mach-O with UUID 1693386C-1F3A-346B-906D-804E7138B2F1 and LC_SOURCE_VERSION 820.0.22; its __binname section contains `sptm.t8101.release`, and it embeds the string `SPTM-820.0.22|2026-08-08:13:24:32.076410|`."
  - "Firmware/txm.iphoneos.release.im4p is a 223,884-byte Image4 payload with FourCC `trxm`, LZFSE compression, and no encryption flag; its SHA-384 value is 6b5c4cc10785a68743b80af7b5a7fc6846fef4fb12c197e85aa5709e199753c3a4e798c98ba5d3e938f974b40f28796f."
  - "The BuildManifest `Ap,TrustedExecutionMonitor` Digest field for the iPhone13,1 customer identity equals that SHA-384 value."
  - "The TXM payload decompresses to a 557,088-byte arm64e Mach-O with UUID 9F80F5EC-09C8-3E9F-A196-13A6250C04E0 and LC_SOURCE_VERSION 217.0.2; its __binname section contains `txm.iphoneos.release`, and it embeds `txm.iphoneos.release.TrustedExecutionMonitor_Guarded-217.0.2` and the info-plist identifier `com.apple.security.libimage4.TXMonitor`."
  - "The TXM Mach-O has a __TEXT_BOOT_EXEC segment containing a __bootcode section. Neither payload has a top-level segment named __PPLTEXT, __PPLDATA, or __PPLDATA_CONST."
  - "The BuildManifest restore entries Ap,RestoreSecurePageTableMonitor (Img4PayloadType rspt) and Ap,RestoreTrustedExecutionMonitor (rtrx) reference the same paths but have distinct digests; those restore-wrapped variants were not resolved."
