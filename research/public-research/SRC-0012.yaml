claims:
  - "The 24A446 release kernelcache is a Mach-O fileset whose top-level segments include __DATA_SPTM and __TEXT_BOOT_EXEC."
  - "The top-level Mach-O segment list does not include __PPLTEXT, __PPLDATA, or __PPLDATA_CONST; a byte scan of the full decompressed image found none of those names."
  - "The kernelcache IM4P identifies KernelManagement_host-514.2.2; the decompressed Mach-O is 66,535,424 bytes."
  - "The release kernelcache IM4P is byte-identical across the iPhone13,1, iPhone13,2/3, and iPhone13,4 images; all copies have IM4P SHA-256 15549697de8054b02321a224e3062861f46763256b28056d392b36b4bfbb6ced and decompressed Mach-O SHA-256 76e0da7892f11a1ff7265cf217306c1211434682a2f398f6bfd7a042d7611fd4."
