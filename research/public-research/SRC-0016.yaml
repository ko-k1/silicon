claims:
  - "The combined BuildManifest declares ProductVersion 27.0.1, ProductBuildVersion 24A446, and SupportedProductTypes [iPhone13,2, iPhone13,3]."
  - "The manifest contains six build identities: Customer Erase Install and Customer Upgrade Install entries for device classes d53gap and d53pap, plus two Research entries."
  - "Customer identities reference Firmware/sptm.t8101.release.im4p and Firmware/txm.iphoneos.release.im4p; Research identities reference Firmware/txm.iphoneos.research.im4p for installed TXM."
  - "Customer identities mark InstalledSPTM, RestoreSPTM, InstalledKernelCache, and RestoreKernelCache as Production. Research identities mark InstalledSPTM and InstalledKernelCache as Research while RestoreSPTM and RestoreKernelCache remain Production."
  - "The installed/restore SPTM digests, the release TXM digest, and the release kernelcache digest match those in the iPhone13,1 and iPhone13,4 24A446 manifests."
