conclusion:
  state: inferred
  confidence: high
  summary: "The 24A446 restore build manifests for all four iPhone 12-family A14 product types (iPhone13,1, iPhone13,2, iPhone13,3, and iPhone13,4) contain SPTM (Firmware/sptm.t8101.release.im4p) and TXM (Firmware/txm.iphoneos.release.im4p) payloads and mark InstalledSPTM/RestoreSPTM as Production. The installed/restore SPTM, release TXM, and release kernelcache digests match across the four product types. The release kernelcache is byte-identical across the four images; its decompressed Mach-O independently shows __DATA_SPTM and __TEXT_BOOT_EXEC segments and no __PPLTEXT/__PPLDATA segment names. The extracted iPhone13,1 SPTM and TXM payloads themselves have SHA-384 values matching the manifest's installed-component Digest fields and decompress to arm64e Mach-O with SPTM/TXM build identifiers (EVD-0018, EVD-0019). This resolves the build-level mechanism in favor of SPTM/TXM; Apple's January 2026 PPL table was not listed as updated after January 2026 in the guide's revision history (EVD-0013). A community tracker still frames A14/M1 as PPL but provides no build-specific measurement (EVD-0015). The target device's runtime state remains unknown."
  limitations:
    - "Build packaging, payload structure, and kernelcache structure are primary evidence that SPTM/TXM is included, but they are not runtime measurements."
    - "No code-signature or trust evaluation was performed on the extracted payloads; matching manifest digests link the bytes to the manifest fields but do not establish device acceptance."
    - "The restore-specific rspt/rtrx entries carry different digests and were not resolved to their wrapped payloads."
    - "Segment naming is a structural indicator; it is not a proof that no PPL-related code exists in any component."
    - "The release kernelcache is byte-identical across the four product types; the combined image's research kernelcache variant was not compared."
    - "A14 iPad product types were not checked."
    - "The target device identity and installed build are not verified on hardware."
    - "No build-specific Apple security note describing the mechanism change was found."
    - "The contradictory Apple page carries a January 2026 date and was not listed as updated after that in the guide's revision history; the contradictory survey and community tracker may be imprecise or based on the older documentation."
