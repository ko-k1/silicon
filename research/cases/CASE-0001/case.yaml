hypothesis:
  claim: "The A14 / iOS 27.0.1 build 24A446 packages and uses SPTM with TXM for page-table and code-execution protection; Apple's 2026-01-28 PPL applicability statement no longer describes the iOS 27 runtime."
  preconditions:
    - "Target is an A14-based device running iOS 27.0.1 build 24A446."
    - "The 24A446 BuildManifests for iPhone13,1, iPhone13,2, iPhone13,3, and iPhone13,4 are representative of the A14 product family."
    - "The public iOS 27 reports refer to the shipping iOS 27 architecture, not only a beta or a single tool's fallback heuristic."
    - "Apple's January 2026 Operating system integrity page was not listed as updated after January 2026 in the guide's revision history (EVD-0013) and may not reflect a mid-cycle mechanism change."
  expected_behavior: "If the claim is correct, the A14 24A446 image should contain SPTM/TXM payloads, public compatibility/tooling reports should treat A14 iOS 27 devices as SPTM/TXM-capable, and Apple's pre-iOS 27 PPL table would remain valid only for earlier OS versions on A14."
  rejection_criteria:
    - "A build-specific Apple source states that A14 on iOS 27.0.1 uses PPL and does not use SPTM."
    - "Reproducible non-invasive evidence from the exact target shows PPL active and SPTM/TXM absent."
    - "The A14 iOS 27 SPTM reports are shown to describe only a different SoC, a beta-only configuration, or a tool fallback rather than the shipping architecture."
    - "The target is shown not to be an A14 device or not to be running 24A446."
