scope:
  in_scope:
    - "Apple restore images and BuildManifest metadata for iPhone13,1."
    - "Public Apple security advisories for iOS 27, 27.0.1, 27.2, and 27.2.1."
    - "Offline Image4, LZFSE, Mach-O, and MH_FILESET inspection."
    - "Differential comparison of build-level component digests, kernelcache images, kext UUIDs, SPTM, and TXM."
    - "Normalized function-level comparison of com.apple.kernel and selected unencrypted kexts."
    - "Candidate triage that maps advisory components to artifacts without asserting exploitability."
  out_of_scope:
    - "Exploit chains, kernel read/write primitives, or privilege-escalation payloads."
    - "PPL, SPTM, or TXM bypass techniques or protection-disablement procedures."
    - "Persistence, patch-finding for operational use, or weaponization."
    - "State-changing or destructive device operations."
    - "Decrypting or circumventing protected system-volume cryptexes."
hypothesis:
  claim: "The iOS 27.2 (24B119) iPhone13,1 image packages different security-relevant components than the iOS 27.0.1 (24A446) image, and the 27.2 advisory's 163 CVEs are disjoint from the 27.0 advisory's 163 CVEs. The pair is therefore a usable offline patch-diff baseline for locating fixed vulnerabilities. This does not assert that any CVE is reachable, exploitable, or a protection-mechanism bypass."
  preconditions:
    - "The local 27.2 IPSW is a complete iPhone13,1 restore image for build 24B119."
    - "The local 27.0.1 IPSW is a complete iPhone13,1 restore image for build 24A446."
    - "BuildManifest component digests and Image4 payload hashes identify the compared bytes."
    - "Advisory CVE membership is treated as scope evidence, not exploitability evidence."
  expected_behavior: "If the claim is correct, security-relevant manifest entries, the release kernelcache, and the SPTM/TXM payloads should differ between the two builds, while some embedded images should remain identical. Re-parsing the advisory JSON should reproduce the 163-CVE 27.2 set and show no overlap with the 27.0 set."
  rejection_criteria:
    - "The two BuildManifests declare identical security-relevant payloads."
    - "The decompressed kernelcache and SPTM/TXM payloads are byte-identical."
    - "The 27.2 advisory reuses CVEs from the 27.0 advisory rather than introducing a disjoint set."
    - "Observed differences are fully explained by metadata or packaging changes with no payload-byte changes."
