objective: "Determine what changed between iOS 27.0.1 (24A446) and iOS 27.2 (24B119) for the iPhone13,1 A14 restore image, and identify which 27.2 advisory components are plausible candidates for binary-level vulnerability-fix analysis. Exploit development, bypass techniques, and protection-disablement work are explicitly out of scope."
