conclusion:
  state: inferred
  confidence: medium
  summary: "The reviewed Dopamine 3.0 release lists stable A14/M1 support through iOS 17.3.1, with Titan's own claimed range extending to 17.4 beta 3. The Apple Wiki lists momentarius for iOS 27, but the reviewed text does not state A14 support for that entry. The 24A446 A14 images for all four iPhone 12-family product types contain SPTM/TXM payloads, the extracted iPhone13,1 installed payloads match the manifest digest fields, and the release kernelcache is byte-identical across the four images with SPTM structure, so an A14 PPL bypass is mis-scoped for that build. A community tracker still frames A14/M1 as PPL but provides no build-specific measurement (EVD-0015). No reviewed source demonstrates an A14 bypass on 24A446; this is an evidence gap, not proof that none exists."
  limitations:
    - "The public record is incomplete, community-maintained, and changes over time."
    - "The Apple Wiki iOS 27 entry lacks SoC-level detail in the reviewed revision."
    - "A community tracker still frames A14/M1 as PPL without a build-specific measurement; this is retained as counter-evidence."
    - "The compatibility ranges describe public tools, not every private or unpublished bypass."
    - "No bypass was tested; this case is a scope survey only."
    - "The 24A446 evidence is build-level, not a runtime measurement."
    - "The release kernelcache is byte-identical across the four product types; the combined image's research kernelcache variant was not compared. A14 iPad product types were not checked."
