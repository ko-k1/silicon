target_manifest: targets/manifests/iphone12mini-ios27.0.1.yaml
owner: null
reviewer: null
objective: "Catalog the publicly documented PPL/SPTM bypass research that claims A14 coverage, compare its claimed iOS ranges with the 24A446 target, and determine whether any reviewed source demonstrates A14 applicability on iOS 27.0.1. Technique-level details, exploit code, offsets, and operational steps are out of scope."
kinds:
  - bypass-research-survey
  - architecture-applicability
components:
  - PPL
  - SPTM
  - TXM
scope:
  in_scope:
    - "Public bypass names, claimed iOS ranges, claimed SoC ranges, and disclosure status."
    - "Dated secondary reporting about public jailbreak compatibility."
    - "The relationship between historical A14 PPL research and the 24A446 SPTM/TXM build evidence."
  out_of_scope:
    - "Exploit code, kernel read/write primitives, patch offsets, or bypass steps."
    - "Protection-disablement procedures, persistence, or weaponization."
    - "Testing any bypass on a device."
    - "Claims that a named bypass works on A14/24A446 without a source that states that scope."
hypothesis:
  claim: "The reviewed Dopamine 3.0 release lists stable A14/M1 support at iOS 16.6 through 17.3.1, and Titan's own claimed range extends to 17.4 beta 3. No reviewed source demonstrates an A14 bypass on iOS 27.0.1 build 24A446; the 24A446 A14 images are SPTM/TXM-based, so an A14 PPL bypass is not the correct boundary for that build."
  preconditions:
    - "The compatibility ranges reported for public tools accurately reflect the cited bypass releases."
    - "The 24A446 BuildManifest evidence for iPhone13,1 is representative of the target build."
    - "An absence of reviewed A14/24A446 coverage is treated as an evidence gap, not proof of impossibility."
  expected_behavior: "If the claim is correct, the reviewed Dopamine 3.0 summary should show A14 support ending at iOS 17.3.1, and iOS 27 entries should be limited to other SoCs or omit A14 support. The 24A446 A14 build should contain SPTM/TXM payloads rather than a PPL-only configuration."
  rejection_criteria:
    - "A public source demonstrates an A14-specific PPL or SPTM bypass on 24A446."
    - "A build-specific source shows the 24A446 A14 image is PPL-based and does not use SPTM/TXM."
    - "The cited A14 compatibility range is shown to extend beyond iOS 17.3.x on a public tool."
