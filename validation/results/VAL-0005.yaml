expected_outcome: "The combined 24A446 manifest should list iPhone13,2 and iPhone13,3, contain SPTM/TXM entries with Production markers in customer identities, and reference the same SPTM, release TXM, and release kernelcache payload digests as the iPhone13,1 and iPhone13,4 manifests. Any difference should be recorded rather than normalized."
observed_outcome: >-
  The combined manifest declares ProductVersion 27.0.1, ProductBuildVersion 24A446,
  SupportedProductTypes [iPhone13,2, iPhone13,3], and six identities: Customer Erase
  Install and Customer Upgrade Install for device classes d53gap and d53pap, plus two
  Research identities. Customer identities reference Firmware/sptm.t8101.release.im4p
  and Firmware/txm.iphoneos.release.im4p and mark InstalledSPTM, RestoreSPTM,
  InstalledKernelCache, and RestoreKernelCache as Production. Research identities
  reference Firmware/txm.iphoneos.research.im4p for installed TXM and mark InstalledSPTM
  and InstalledKernelCache as Research. Across the three manifests, the installed SPTM,
  restore SPTM, release TXM, and release kernelcache digests are identical; the exact
  values are recorded in digest_comparison. The combined manifest additionally contains
  distinct research TXM and research kernelcache digests, which are recorded but not
  treated as production.
