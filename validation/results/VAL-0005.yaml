  summary: "Build-level check passed: the combined iPhone13,2/iPhone13,3 24A446 manifest packages SPTM/TXM and references the same release SPTM, TXM, and kernelcache payload digests as the iPhone13,1 and iPhone13,4 manifests. This completes build-packaging coverage of the four iPhone 12-family A14 product types and does not measure runtime enforcement."
reproduction:
  - "Read BuildManifest.plist from the restore image through an HTTP range request; verify sha256 51827a7ebd3b9130d03acf200e269ba66768fa42e1569b246b053a1c22c29364."
  - "Run: python3 -m engineering.inventory.build_manifest <BuildManifest.plist> and compare identities, VariantContents markers, paths, and 48-byte digest values."
  - "Run the fixture tests: python3 -m unittest discover -s tests/unit -t ."
limitations:
  - "Only packaging metadata was inspected; no runtime state, boot path, or device behavior was measured."
  - "The 11.3 GB combined IPSW was not downloaded in full; its container SHA-256 was not recomputed. The BuildManifest extraction is pinned by the recorded BuildManifest SHA-256."
  - "Research identities are present in the combined manifest; they are not treated as the target or production configuration."
  - "Digest equality identifies the payloads referenced by the manifests; it does not verify the remote payload bytes or establish that every boot path loads them. VAL-0006 records the later byte-level kernelcache comparison."
  - "Coverage is limited to the four iPhone 12-family A14 product types; A14 iPad product types were not checked."
  - "The kernelcache Mach-O inspection in VAL-0003 was performed on the iPhone13,1 image. This validation relies on matching manifest kernelcache digests; VAL-0006 records the byte-level comparison that extends the same release payload to the other product types."
  - "The exact target device identity and installed build remain unverified; VAL-0001 is still not-run."
