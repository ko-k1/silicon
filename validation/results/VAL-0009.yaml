  - "Run: python3 -m engineering.analyzers.build_manifest_diff <24A446 BuildManifest.plist> <24B119 BuildManifest.plist>"
  - "Compare JSON summary.components_compared=95, summary.same=38, summary.changed_count=57, summary.added=[], summary.removed=[]."
  - "Inspect analysis/differential/ios27.2-vs-27.0.1-buildmanifest.json for the full changed list."
limitations:
