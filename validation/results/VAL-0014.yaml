expected_outcome: "The targeted follow-up should identify concrete 27.2 code changes in exception-port validation and AppleAVE2, qualify the ANE vtable counts, and avoid mapping any change to a CVE without evidence."
observed_outcome: "Both exception-port validation functions add a com.apple.security.cs.debugger entitlement query; the string is absent from 24A446 and present once in 24B119. AppleAVE2 adds three named validation routines (AVE_HEVC_CheckVPSExtBounds 310 insns, AVE_Client_CheckMCTFInfo 737 insns, AVE_Client_CheckLRMEInfo 571 insns) with new out-of-range log anchors and multiple unsigned range checks. Caller wiring changed: AVE_HEVC_CheckInfo grew 361->893 insns and now calls AVE_HEVC_CheckVPSExtBounds; AVE_Client_CheckInfo grew 506->604 insns and now calls AVE_Client_CheckGGMInfo, AVE_Client_CheckLRMEInfo, and AVE_Client_CheckMCTFInfo. New HEVC VPS/PPS/RPS/SPS range-check log strings and constraint strings appeared; three temporal-layer strings were removed. The ANE vtable raw 55-slot count resolves to 11 same-name/same-slot changed-body rows (7 unique target pairs), 8 one-sided rows (4 unique pairs), and 36 both-unnamed rows (23 unique pairs). The later VAL-0017 recheck resolves the four one-sided rows as slot reordering and qualifies the PMSettingObject label at 0xfffffff00a8e69e8 as a signature-set coverage artifact: the xnu-only map assigns PMSettingObject, while the full xnu+kext map assigns IOUserClient::sendAsyncResult; overlaying the xnu-only new-build names on the full map reproduces the earlier 16 same-slot-different-name rows exactly. No CVE was mapped to a function."
result:
  status: passed
  reproducible: "yes"
  summary: "The targeted follow-up produced concrete, bounded code-change observations and corrected the interpretation of the ANE vtable counts. It does not establish vulnerability fixes, CVE attribution, or exploitability."
reproduction:
  - "Extract com.apple.kernel, AppleAVE2, and AppleH11ANEInterface from each kernelcache with ipsw kernel extract."
  - "Generate function starts with ipsw macho info -f and disassembly with llvm-objdump -d --no-show-raw-insn."
  - "Symbolicate with ipsw kernel symbolicate and the matching symbolicator signature set."
  - "Run python3 -m engineering.analyzers.kernel_function_diff for the kernel and kext pairs."
  - "Inspect analysis/differential/ios27.2-vs-27.0.1-targeted-findings.json for the exception-port, AVE2, and ANE qualification data."
  - "Verify the com.apple.security.cs.debugger string presence in both kernel string dumps and the new AVE2 anchor strings in both AVE2 string dumps."
limitations:
  - "The kernel and kexts are stripped; helper and method names are partial and symbolicator labels can be wrong."
  - "Same virtual addresses across builds are not function correspondence."
  - "Vtable slot counts are raw-slot counts and include inherited-slot and reordering effects."
  - "The PMSettingObject example is a signature-set coverage artifact: it appears with the xnu-only signature set, while the full xnu+kext set names the same address IOUserClient::sendAsyncResult; signature labels remain candidate labels."
  - "No CVE-to-function mapping, exploitability, or protection-bypass conclusion is established."
  - "No device was connected; runtime behavior was not measured."
