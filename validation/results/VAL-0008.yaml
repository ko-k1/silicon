  - "Parse the customer BuildIdentity and read Digest for Ap,RestoreSecurePageTableMonitor and Ap,RestoreTrustedExecutionMonitor."
  - "Copy each IM4P and replace only the four type bytes after the IM4P magic (offsets 13-16 in these files): sptm -> rspt and trxm -> rtrx."
  - "Compute SHA-384 of each retagged copy and compare with the manifest restore Digest; also confirm the byte lengths are unchanged."
  - "Optionally run pyimg4 im4p info on the retagged copies to confirm the rspt/rtrx FourCC and unchanged data sizes."
