result:
  status: passed
  reproducible: "yes"
  summary: "The 24A446 restore digests for SPTM and TXM are reproduced exactly by changing only the four-byte IM4P type field in copies of the installed payloads. This resolves the restore-role digest difference at the IM4P level: it is a re-tagging operation, not evidence of a distinct payload body. It is not a signature, personalized-IMG4, boot-path, or runtime check."
reproduction:
