expected_outcome: "The A14 24A446 payloads should match the manifest digest fields and parse as arm64e Mach-O with SPTM/TXM identifiers. The DeviceTree/iBoot should contain SPTM/TXM boot references. The A14 24A446 SPTM should share source version with the T8150 24A446 SPTM but not its UUID or bytes. The A14 24B119 SPTM should differ from 24A446 and should be checked for the TLB-fix string family described by public T8150 research. The public research's 27.0.1 SPTM version row should be compared with the primary extraction."
observed_outcome: "The 24A446 A14 SPTM is 820.0.22 (UUID 1693386C-1F3A-346B-906D-804E7138B2F1, 1,179,680 bytes) and the T8150 24A446 SPTM is also 820.0.22 (UUID 325C14BC-3EFA-33A3-9E5C-7A7049E321CD, 1,261,600 bytes); the TXM payloads are byte-identical. The A14 24B119 SPTM is 820.40.24 (UUID 88CA33DC-BE08-313D-AF19-397E47C76983, 1,179,680 bytes) and contains uat_dekker_gate_lock, uat_dekkerlock_lock, uat_sync_outer_tlb_sapt_flush, verify-gmmu-tlbis-at-sync, gmmu-tlbi-verification-reg, gmmu-tlbi-verification-bit, and VIOLATION_NVME_ILLEGAL_HIBERNATION_QUEUE_LATCH; the 24A446 A14 SPTM does not. The 24A446 DeviceTree contains chosen:txm-secure-channel = 1 and a dart-sep TXM secure-channel base/size of 0x4000; the 24A446 iBoot contains lay_out_sptm_objects, sptm-path, txm-path, SPTM-uuid-offset, SPTM, kernel-ctrr-to-be-enabled, and ctrr-a..d. The 24B119 DeviceTree still contains chosen:txm-secure-channel = 1. The public research's 27.0.1 SPTM version row (820.40.18) is not reproduced; the primary 24A446 T8150 payload is 820.0.22."
result:
  status: passed
  reproducible: "yes"
  summary: "The offline checks reproduce the recorded hashes, versions, UUIDs, boot-configuration references, and the A14 24B119 TLB-fix string family. They also qualify the public T8150 research's 27.0.1 SPTM version row as inconsistent with the primary 24A446 payload. The check does not establish runtime activation, code-level equivalence, CVE attribution, or exploitability."
reproduction:
  - "Extract Firmware/sptm.t8101.release.im4p, Firmware/txm.iphoneos.release.im4p, Firmware/all_flash/DeviceTree.d52gap.im4p, and Firmware/all_flash/iBoot.d52g.RELEASE.im4p from the iPhone13,1 24A446 and 24B119 restore images."
  - "Parse each IM4P with engineering.parsers.image4, decompress the LZFSE payload with lzfse 0.4.2.post1, and parse the Mach-O header with engineering.parsers.macho."
  - "Run llvm-objdump --macho --section-headers to record the __text section size and ipsw dtree to render the DeviceTree."
  - "Search the decompressed iBoot for SPTM/TXM layout strings and the DeviceTree for txm-secure-channel properties."
  - "Fetch Firmware/sptm.t8150.release.im4p and Firmware/txm.iphoneos.release.im4p from the iPhone18,4 24A446 and 24B119 restore images with remotezip range requests; repeat the IM4P/Mach-O checks."
  - "Compare the A14 and T8150 SPTM source versions, UUIDs, Mach-O sizes, and __text sizes; compare the TXM payload hashes."
  - "Search the A14 24A446 and 24B119 SPTM strings for the TLB-fix string family and compare with SRC-0022."
  - "Record the result in analysis/architecture/a14-sptm-ppl-current-data.json and EVD-0035/EVD-0036."
limitations:
  - "No physical device was connected; runtime SPTM/TXM state and enforcement were not measured."
  - "The A14 emulator evidence is from a different build (24A437) and is not part of this offline check."
  - "Source-version, UUID, size, and string comparisons do not establish code-level equivalence."
  - "The TLB-fix string family is a public-research characterization; its presence in the A14 24B119 binary does not prove the same fix or a security effect."
  - "No CVE is mapped and no exploitability or bypass conclusion is established."
  - "The raw IPSWs and extracted payloads are not committed; hashes and commands are recorded instead."
  - "The public T8150 research's 27.0.1 SPTM version row is inconsistent with the primary extraction; the primary value is used for the observed build."
